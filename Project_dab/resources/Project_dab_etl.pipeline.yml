# The main pipeline for Project_dab

resources:
  pipelines:
    Project_dab_etl:
      name: Project_dab_etl_v2
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/Project_dab_etl"

      libraries:
        - glob:
            include: ../src/Project_dab_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
