# This is a Databricks asset bundle definition for Project_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Project_dab
  uuid: 465870f0-c19f-4be7-b367-edef1ebdc2f5

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog: 
    default: "project_catalog"
  schema:
    default: "gold"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://adb-7405604903643053.13.azuredatabricks.net
      root_path: /Workspace/Users/mukamseries@gmail.com/.bundle/${bundle.name}/${bundle.target}
    presets: 
      source_linked_deployment : false
    variables:
      catalog: project_catalog
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://adb-7405604903643053.13.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/mukamseries@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mukamseries@gmail.com/prod/${bundle.name}/${bundle.target}
      
    variables:
      catalog: project_catalog
      schema: prod
    presets: 
      source_linked_deployment : false
      
    permissions:
      - user_name: mukamseries@gmail.com
        level: CAN_MANAGE
